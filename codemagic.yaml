workflows:
  android-web-app:
    name: Android Web App Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Preparing Web Artifacts
        script: |
          echo "Packing HTML5 Game files..."
          mkdir -p output
          cp -r * output/ || true
    artifacts:
      - output/**/*
      - "*.apk"
      
