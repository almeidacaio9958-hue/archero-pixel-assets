workflows:
  android-apk-build:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Prepare Web Folder & Build APK
        script: |
          echo "Organizing files for Capacitor..."
          mkdir -p www
          # Copiar o index.html e os sprites para a pasta www
          cp index.html www/
          cp *.png www/ || true
          
          # Instalar dependências do Capacitor
          npm install @capacitor/cli @capacitor/core @capacitor/android
          
          # Inicializar o Capacitor apontando para a pasta www
          npx cap init "Archero Pixel" "com.archero.pixelgame" --web-dir www
          
          # Adicionar plataforma Android e sincronizar
          npx cap add android
          npx cap sync android
          
          # Compilar o APK
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      
