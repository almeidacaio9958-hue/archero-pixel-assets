<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Archero Pixel Mobile - Dungeon Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            background-color: #1a1a1a;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            touch-action: none;
            width: 100%;
            max-width: 400px;
            height: auto;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="650"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Carregar Sprites
const imagens = {};
const nomesSprites = [
    "heroi_arqueiro.png", 
    "inimigo_slime.png", 
    "inimigo_demonio_chefe.png",
    "projetil_flecha.png",
    "item_moeda.png",
    "cenario_chao_pedra.png",
    "cenario_parede_topo.png"
];

nomesSprites.forEach(nome => {
    imagens[nome] = new Image();
    imagens[nome].src = nome;
});

// Estado do Jogo
let estadoJogo = "JOGANDO"; // "JOGANDO", "GAMEOVER", "VITORIA"
let vagaAtual = 1;
let moedasColetadas = 0;

// Limites da Arena (dentro das paredes)
const arena = {
    x: 30,
    y: 80,
    largura: 340,
    altura: 520
};

// Jogador
let jogador = {
    x: 184,
    y: 480,
    largura: 44,
    altura: 44,
    velocidade: 3.8,
    hpMax: 100,
    hp: 100,
    movendo: false
};

let inimigos = [];
let projeteis = [];
let moedas = [];
let ultimoTiro = 0;

// Controlo por Toque (Joystick Virtual / Direcional)
let toqueX = 0;
let toqueY = 0;
let tocando = false;

function iniciarVaga(vaga) {
    inimigos = [];
    projeteis = [];
    moedas = [];

    if (vaga === 1) {
        inimigos.push({ x: 100, y: 150, largura: 48, altura: 48, velocidade: 1.2, hp: 60, hpMax: 60, tipo: "slime" });
        inimigos.push({ x: 250, y: 150, largura: 48, altura: 48, velocidade: 1.2, hp: 60, hpMax: 60, tipo: "slime" });
    } else if (vaga === 2) {
        inimigos.push({ x: 80, y: 140, largura: 48, altura: 48, velocidade: 1.4, hp: 80, hpMax: 80, tipo: "slime" });
        inimigos.push({ x: 200, y: 180, largura: 48, altura: 48, velocidade: 1.4, hp: 80, hpMax: 80, tipo: "slime" });
        inimigos.push({ x: 280, y: 140, largura: 48, altura: 48, velocidade: 1.4, hp: 80, hpMax: 80, tipo: "slime" });
    } else if (vaga === 3) {
        // Chefe Demónio
        inimigos.push({ x: 168, y: 150, largura: 64, altura: 64, velocidade: 0.9, hp: 300, hpMax: 300, tipo: "chefe" });
    }
}

iniciarVaga(vagaAtual);

// Eventos de Toque
canvas.addEventListener("pointerdown", (e) => {
    if (estadoJogo === "GAMEOVER" || estadoJogo === "VITORIA") {
        vagaAtual = 1;
        moedasColetadas = 0;
        jogador.hp = 100;
        jogador.x = 184;
        jogador.y = 480;
        estadoJogo = "JOGANDO";
        iniciarVaga(1);
        return;
    }
    tocando = true;
    atualizarToque(e);
});

canvas.addEventListener("pointermove", (e) => {
    if (tocando && estadoJogo === "JOGANDO") {
        atualizarToque(e);
    }
});

canvas.addEventListener("pointerup", () => {
    tocando = false;
    jogador.movendo = false;
});

function atualizarToque(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    toqueX = (e.clientX - rect.left) * scaleX;
    toqueY = (e.clientY - rect.top) * scaleY;
    jogador.movendo = true;
}

function verificarColisao(obj1, obj2) {
    return (
        obj1.x < obj2.x + obj2.largura &&
        obj1.x + obj1.largura > obj2.x &&
        obj1.y < obj2.y + obj2.altura &&
        obj1.y + obj1.altura > obj2.y
    );
}

// Loop Principal
function atualizar() {
    if (estadoJogo !== "JOGANDO") return;

    // Movimentação fluida baseada no toque
    if (jogador.movendo) {
        let centroX = jogador.x + jogador.largura / 2;
        let centroY = jogador.y + jogador.altura / 2;
        let dx = toqueX - centroX;
        let dy = toqueY - centroY;
        let dist = Math.hypot(dx, dy);

        if (dist > 5) {
            jogador.x += (dx / dist) * jogador.velocidade;
            jogador.y += (dy / dist) * jogador.velocidade;
        }
    } else {
        // Disparo Automático (Estilo Archero: para de andar, dispara flecha)
        let agora = Date.now();
        if (agora - ultimoTiro > 550 && inimigos.length > 0) {
            let alvo = inimigos[0];
            if (alvo) {
                let ax = alvo.x + alvo.largura / 2;
                let ay = alvo.y + alvo.altura / 2;
                let hx = jogador.x + jogador.largura / 2;
                let hy = jogador.y + jogador.altura / 2;
                let ang = Math.atan2(ay - hy, ax - hx);

                projeteis.push({
                    x: hx - 4,
                    y: hy - 4,
                    velX: Math.cos(ang) * 8,
                    velY: Math.sin(ang) * 8,
                    largura: 10,
                    altura: 16
                });
                ultimoTiro = agora;
            }
        }
    }

    // Restringir Jogador dentro da Arena
    jogador.x = Math.max(arena.x, Math.min(arena.x + arena.largura - jogador.largura, jogador.x));
    jogador.y = Math.max(arena.y, Math.min(arena.y + arena.altura - jogador.altura, jogador.y));

    // Inimigos perseguem o jogador
    for (let i = inimigos.length - 1; i >= 0; i--) {
        let m = inimigos[i];
        let mx = m.x + m.largura / 2;
        let my = m.y + m.altura / 2;
        let jx = jogador.x + jogador.largura / 2;
        let jy = jogador.y + jogador.altura / 2;

        let dx = jx - mx;
        let dy = jy - my;
        let dist = Math.hypot(dx, dy);

        if (dist > 2) {
            m.x += (dx / dist) * m.velocidade;
            m.y += (dy / dist) * m.velocidade;
        }

        // Dano ao jogador
        if (verificarColisao(m, jogador)) {
            jogador.hp -= 0.4;
            if (jogador.hp <= 0) {
                jogador.hp = 0;
                estadoJogo = "GAMEOVER";
            }
        }
    }

    // Atualizar Flechas
    for (let i = projeteis.length - 1; i >= 0; i--) {
        let p = projeteis[i];
        p.x += p.velX;
        p.y += p.velY;

        if (p.x < arena.x || p.x > arena.x + arena.largura || p.y < arena.y || p.y > arena.y + arena.altura) {
            projeteis.splice(i, 1);
            continue;
        }

        // Colisão Flecha x Inimigo
        for (let j = inimigos.length - 1; j >= 0; j--) {
            let m = inimigos[j];
            if (verificarColisao(p, m)) {
                m.hp -= 30;
                projeteis.splice(i, 1);

                if (m.hp <= 0) {
                    moedas.push({
                        x: m.x + m.largura / 3,
                        y: m.y + m.altura / 3,
                        largura: 20,
                        altura: 20
                    });
                    inimigos.splice(j, 1);
                }
                break;
            }
        }
    }

    // Coleta de Moedas
    for (let i = moedas.length - 1; i >= 0; i--) {
        if (verificarColisao(jogador, moedas[i])) {
            moedasColetadas += 15;
            moedas.splice(i, 1);
        }
    }

    // Avançar Vaga
    if (inimigos.length === 0 && moedas.length === 0) {
        if (vagaAtual < 3) {
            vagaAtual++;
            iniciarVaga(vagaAtual);
        } else {
            estadoJogo = "VITORIA";
        }
    }
}

// Desenhar Elementos
function desenhar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fundo da Masmorra (Chão de Pedra em mosaico)
    let imgChao = imagens["cenario_chao_pedra.png"];
    if (imgChao && imgChao.complete) {
        let patW = 64, patH = 64;
        for (let x = arena.x; x < arena.x + arena.largura; x += patW) {
            for (let y = arena.y; y < arena.y + arena.altura; y += patH) {
                ctx.drawImage(imgChao, x, y, patW, patH);
            }
        }
    } else {
        ctx.fillStyle = "#332211";
        ctx.fillRect(arena.x, arena.y, arena.largura, arena.altura);
    }

    // Paredes da Masmorra
    let imgParede = imagens["cenario_parede_topo.png"];
    if (imgParede && imgParede.complete) {
        ctx.drawImage(imgParede, 0, 0, canvas.width, 80);
    } else {
        ctx.fillStyle = "#4a3b32";
        ctx.fillRect(0, 0, canvas.width, 80);
    }

    // Moldura / Borda da Arena
    ctx.strokeStyle = "#ffcc00";
    ctx.lineWidth = 3;
    ctx.strokeRect(arena.x, arena.y, arena.largura, arena.altura);

    // Desenhar Moedas
    moedas.forEach(m => {
        let imgM = imagens["item_moeda.png"];
        if (imgM && imgM.complete) {
            ctx.drawImage(imgM, m.x, m.y, m.largura, m.altura);
        } else {
            ctx.fillStyle = "gold";
            ctx.fillRect(m.x, m.y, m.largura, m.altura);
        }
    });

    // Desenhar Inimigos
    inimigos.forEach(m => {
        let sprite = m.tipo === "chefe" ? "inimigo_demonio_chefe.png" : "inimigo_slime.png";
        let imgM = imagens[sprite];
        if (imgM && imgM.complete) {
            ctx.drawImage(imgM, m.x, m.y, m.largura, m.altura);
        } else {
            ctx.fillStyle = m.tipo === "chefe" ? "purple" : "lime";
            ctx.fillRect(m.x, m.y, m.largura, m.altura);
        }

        // Barra de Vida Inimigo
        ctx.fillStyle = "black";
        ctx.fillRect(m.x, m.y - 8, m.largura, 5);
        ctx.fillStyle = "red";
        ctx.fillRect(m.x, m.y - 8, (m.hp / m.hpMax) * m.largura, 5);
    });

    // Desenhar Jogador
    let imgHeroi = imagens["heroi_arqueiro.png"];
    if (imgHeroi && imgHeroi.complete) {
        ctx.drawImage(imgHeroi, jogador.x, jogador.y, jogador.largura, jogador.altura);
    } else {
        ctx.fillStyle = "cyan";
        ctx.fillRect(jogador.x, jogador.y, jogador.largura, jogador.altura);
    }

    // Barra de Vida Jogador
    ctx.fillStyle = "black";
    ctx.fillRect(jogador.x, jogador.y - 10, jogador.largura, 6);
    ctx.fillStyle = "lime";
    ctx.fillRect(jogador.x, jogador.y - 10, (jogador.hp / jogador.hpMax) * jogador.largura, 6);

    // Desenhar Flechas
    projeteis.forEach(p => {
        let imgF = imagens["projetil_flecha.png"];
        if (imgF && imgF.complete) {
            ctx.drawImage(imgF, p.x, p.y, p.largura, p.altura);
        } else {
            ctx.fillStyle = "yellow";
            ctx.fillRect(p.x, p.y, p.largura, p.altura);
        }
    });

    // HUD / Topo
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px 'Courier New'";
    ctx.fillText("VAGA: " + vagaAtual + "/3", 25, 45);
    ctx.fillText("MOEDAS: " + moedasColetadas, 230, 45);

    // Ecrãs Finais
    if (estadoJogo === "GAMEOVER") {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff3333";
        ctx.font = "bold 36px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, 280);
        ctx.fillStyle = "white";
        ctx.font = "16px 'Courier New'";
        ctx.fillText("Toque no ecrã para tentar de novo", canvas.width / 2, 330);
        ctx.textAlign = "left";
    } else if (estadoJogo === "VITORIA") {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffcc00";
        ctx.font = "bold 36px 'Courier New'";
        ctx.textAlign = "center";
        ctx.fillText("VITÓRIA!", canvas.width / 2, 260);
        ctx.fillStyle = "white";
        ctx.font = "18px 'Courier New'";
        ctx.fillText("Moedas Totais: " + moedasColetadas, canvas.width / 2, 310);
        ctx.font = "14px 'Courier New'";
        ctx.fillText("Toque para jogar novamente", canvas.width / 2, 360);
        ctx.textAlign = "left";
    }
}

function loop() {
    atualizar();
    desenhar();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
